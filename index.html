<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Second Brain — vault</title>
  <meta name="description" content="Vercel-ready second-brain vault of project READMEs, OSINT notes, and cybersecurity pointers." />
  <style>
    :root { --bg:#0b1210; --bg-2:#121a17; --panel:#16201c; --line:#2a3a33; --ink:#e8eee8; --muted:#9aa89f; --sage:#9bb59a; --sage-2:#c5dcc3; --warn:#e3b56a; }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,serif}
    a{color:var(--sage-2)} header{display:flex;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--line);background:var(--bg-2);position:sticky;top:0}
    header span{color:var(--muted);font-size:.85rem}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 61px)}
    nav{border-right:1px solid var(--line);background:var(--bg-2);padding:1rem .75rem 2rem} nav h2{margin:.4rem .6rem .35rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:sans-serif}
    nav button{display:block;width:100%;text-align:left;background:0;color:var(--ink);border:0;border-radius:8px;padding:.55rem .7rem;cursor:pointer;font:inherit}
    nav button.active,nav button:hover{background:var(--panel);color:var(--sage-2)} nav small{display:block;color:var(--muted);font-size:.75rem;font-family:sans-serif}
    main{padding:1.5rem 1.75rem 3rem;max-width:860px}.status{display:inline-block;font-family:sans-serif;font-size:.72rem;text-transform:uppercase;border:1px solid var(--line);padding:.15rem .45rem;border-radius:999px;color:var(--muted)}
    .status.ok{color:var(--sage);border-color:#35503a}.status.warn{color:var(--warn);border-color:#5d4a28}
    article table{width:100%;border-collapse:collapse} article th,article td{border:1px solid var(--line);padding:.4rem .5rem;vertical-align:top}
    article pre{background:#0a0f0d;padding:.9rem;overflow:auto;border:1px solid var(--line);border-radius:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;cursor:pointer;margin:.5rem 0}
    .note{color:var(--muted)} @media(max-width:820px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div><strong>Second Brain</strong><span> · vercel-demo-deployment</span></div><span>anorakadrian / static vault</span></header>
  <div class="layout"><nav id="nav"></nav><main id="main"></main></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
